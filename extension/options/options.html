<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meaning Filter — Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #e0e0e0;
      background: #0f0f1a;
      padding: 40px;
      max-width: 720px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; color: #fff; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 32px; font-size: 13px; }
    h2 {
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 32px 0 12px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }
    .section {
      background: #16213e;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      background: #0d1b2a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 13px;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #7c5cbf;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.15s;
    }
    .btn-primary {
      background: #7c5cbf;
      color: #fff;
    }
    .btn-primary:hover { background: #6a4daa; }
    .btn-secondary {
      background: #333;
      color: #ccc;
    }
    .btn-secondary:hover { background: #444; }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .value-card {
      background: #0d1b2a;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .value-card h4 {
      color: #c4b5e0;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .value-card .policy {
      color: #888;
      font-size: 12px;
      margin: 2px 0;
    }
    .value-card .remove {
      float: right;
      color: #555;
      cursor: pointer;
      font-size: 12px;
    }
    .value-card .remove:hover { color: #e55; }
    .import-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .import-row .field { flex: 1; }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 12px;
      display: none;
    }
    .status.success { display: block; background: #0d2e1a; color: #6fcf97; }
    .status.error { display: block; background: #2e0d0d; color: #e55; }
    .or-divider {
      text-align: center;
      color: #555;
      margin: 16px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Meaning Filter</h1>
  <p class="subtitle">Filter your newsfeed by what actually matters to you.</p>

  <h2>Import from Matching API</h2>
  <div class="section">
    <div class="import-row">
      <div class="field">
        <label for="api-url">API URL</label>
        <input type="text" id="api-url" placeholder="http://localhost:8000">
      </div>
      <div class="field">
        <label for="user-id">User ID</label>
        <input type="text" id="user-id" placeholder="your-user-id">
      </div>
      <button class="btn-primary" id="import-btn">Import</button>
    </div>
    <div id="import-status" class="status"></div>
  </div>

  <div class="or-divider">or add values manually</div>

  <h2>Add a Value</h2>
  <div class="section">
    <label for="new-title">Title (2-5 words)</label>
    <input type="text" id="new-title" placeholder="Generative Honesty">

    <label for="new-policies" style="margin-top: 12px;">
      Attention policies (one per line, CAPITALIZED_NOUN + phrase)
    </label>
    <textarea id="new-policies" placeholder="MOMENTS where telling a difficult truth opens a new possibility
SIGNS that someone is ready to hear what they need to hear
WAYS of speaking that make hard truths land as gifts"></textarea>

    <div class="btn-row">
      <button class="btn-primary" id="add-btn">Add Value</button>
    </div>
  </div>

  <h2>Your Values</h2>
  <div id="values-container">
    <p style="color: #555;">No values yet.</p>
  </div>

  <h2>Export / Import JSON</h2>
  <div class="section">
    <div class="btn-row">
      <button class="btn-secondary" id="export-btn">Export JSON</button>
      <button class="btn-secondary" id="import-json-btn">Import JSON</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>

  <script src="options.js"></script>
</body>
</html>
